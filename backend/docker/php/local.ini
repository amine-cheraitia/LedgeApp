upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; Demo Docker : ne jamais re-verifier les fichiers sources a chaque requete
; (les stat() traversent le bind mount, couteux sous Windows). Toute modification
; du code backend necessite un redemarrage du conteneur app pour etre prise en compte.
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
