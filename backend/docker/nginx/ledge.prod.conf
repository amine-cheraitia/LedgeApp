# Nginx embarque dans l'image de production backend : sert l'API Laravel
# sur le port 8000, php-fpm ecoute en local dans le meme conteneur.
server {
    listen 8000;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Bloquer l'acces aux fichiers sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
