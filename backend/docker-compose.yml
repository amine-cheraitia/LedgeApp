services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ledge_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ledge
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: ledge_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/ledge.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ledge
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: ledge_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ledge}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-ledge}
    ports:
      - "3307:3306"
    volumes:
      - ledge_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - ledge

  redis:
    image: redis:7-alpine
    container_name: ledge_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - ledge

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ledge_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - ledge
    depends_on:
      - mysql
      - redis

networks:
  ledge:
    driver: bridge

volumes:
  ledge_mysql_data:
    driver: local
