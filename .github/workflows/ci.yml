name: CI

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

jobs:
  gitflow-guard:
    name: Gitflow — feature/* ne peut pas cibler main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Bloquer PR feature/* vers main
        if: startsWith(github.head_ref, 'feature/') && github.base_ref == 'main'
        run: |
          echo "::error::Les branches feature/* doivent cibler 'develop', pas 'main'. Gitflow : feature -> develop -> main."
          exit 1

  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, xml, ctype, json, bcmath
          coverage: pcov

      - name: Get Composer cache dir
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      - name: Run Pint (lint)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Run PHPUnit tests avec gate de couverture (>= 80%)
        working-directory: backend
        run: composer test:coverage

      # Bloquant : une advisory Composer doit faire echouer le pipeline pour etre
      # traitee (les dependances sont a jour, cf. docs/SECURITY.md).
      - name: Audit des dependances Composer
        working-directory: backend
        run: composer audit

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest tests avec gate de couverture (seuils vitest)
        working-directory: frontend
        run: npm run test:coverage

      # Bloquant a partir de high : une vulnerabilite high/critical fait echouer le
      # pipeline (les advisories low/moderate restent visibles sans bloquer).
      - name: Audit des dependances npm (high/critical bloquant)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        working-directory: frontend
        run: npx vue-tsc -b --noEmit

      - name: Build
        working-directory: frontend
        run: npx vite build
