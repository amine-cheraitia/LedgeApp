name: CI

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

jobs:
  gitflow-guard:
    name: Gitflow — feature/* ne peut pas cibler main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Bloquer PR feature/* vers main
        if: startsWith(github.head_ref, 'feature/') && github.base_ref == 'main'
        run: |
          echo "::error::Les branches feature/* doivent cibler 'develop', pas 'main'. Gitflow : feature -> develop -> main."
          exit 1

  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, xml, ctype, json, bcmath
          coverage: pcov

      - name: Get Composer cache dir
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      - name: Run Pint (lint)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Run PHPUnit tests avec gate de couverture (>= 80%)
        working-directory: backend
        run: composer test:coverage

      # Bloquant : une advisory Composer doit faire echouer le pipeline pour etre
      # traitee (les dependances sont a jour, cf. docs/SECURITY.md).
      - name: Audit des dependances Composer
        working-directory: backend
        run: composer audit

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest tests avec gate de couverture (seuils vitest)
        working-directory: frontend
        run: npm run test:coverage

      # Bloquant a partir de high : une vulnerabilite high/critical fait echouer le
      # pipeline (les advisories low/moderate restent visibles sans bloquer).
      - name: Audit des dependances npm (high/critical bloquant)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        working-directory: frontend
        run: npx vue-tsc -b --noEmit

      - name: Build
        working-directory: frontend
        run: npx vite build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Ne tourne qu'apres les gates unitaires : inutile de payer 4 min d'E2E
    # sur une PR dont les tests unitaires echouent deja.
    needs: [backend, frontend]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, ctype, json, bcmath

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Les deux serveurs (backend 8001 via --env=e2e -> backend/.env.e2e,
      # genere au chargement de la config Playwright depuis .env.e2e.example
      # avec key:generate — le fichier n'est pas versionne ; base MySQL
      # ledge_e2e creee par le global-setup ; frontend 5174) sont demarres
      # et arretes par Playwright (webServer).
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report (en cas d'echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
